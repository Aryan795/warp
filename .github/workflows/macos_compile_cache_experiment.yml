on:
  # Remove this pull_request trigger and its job guard after the workflow lands
  # on the default branch, where workflow_dispatch becomes available.
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      cache_scope:
        description: >-
          Which runner profile, and therefore which Rust cache volume, the warm
          arm reuses. "shared" is the production 50 GB mac-ci profile;
          "isolated" is the dedicated 84 GB tests-only profile.
        type: choice
        default: shared
        options:
          - shared
          - isolated
      warmup:
        description: >-
          Mark this run as an uncounted warm-up that seeds the cache. Excluded
          from measurement statistics.
        type: boolean
        default: false

name: macOS Compile Cache Experiment

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  WORKSPACE_TEST_ARGS: --workspace --locked --exclude command-signatures-v2
  RUSTFLAGS: -C debuginfo=line-tables-only --cfg=web_sys_unstable_apis

jobs:
  compile:
    name: Compile tests (${{ matrix.cache_mode }} Rust cache, ${{ inputs.cache_scope || 'shared' }} volume${{ inputs.warmup && ', warm-up' || '' }})
    if: >-
      github.repository_owner == 'warpdotdev' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'kevinyang/macos-ci-observability'))
    timeout-minutes: 40
    # Two Namespace profiles with identical machine specs and different cache
    # volumes: mac-ci is production's 50 GB volume, mac-ci-tests-84gb is the
    # dedicated 84 GB one. Selecting a whole profile is what isolates the cache,
    # so no cache-tag override is needed. Never add an `nscloud-cache-size-*`
    # label beside a profile label: Namespace refuses to schedule a job carrying
    # more than one `nscloud` label, and the job silently never gets acquired.
    # `runs-on` cannot read `env`, so these names are repeated in the
    # `runner_profile` input below and the two must stay in sync.
    runs-on: ${{ inputs.cache_scope == 'isolated' && 'namespace-profile-mac-ci-tests-84gb' || 'namespace-profile-mac-ci' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cache_mode:
          - warm
          - scratch
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Use ephemeral Rust paths
        if: ${{ matrix.cache_mode == 'scratch' }}
        shell: bash
        run: |
          {
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-home"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/prepare_environment
        id: prepare_environment
        with:
          target_os: macos
          is_self_hosted: false
          install_test_deps: true
          enable_rust_cache: ${{ matrix.cache_mode == 'warm' }}

      - name: Install cargo nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: nextest

      - name: Compile tests
        uses: ./.github/actions/compile_macos_tests
        with:
          workspace_test_args: ${{ env.WORKSPACE_TEST_ARGS }}
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          runner_profile: ${{ inputs.cache_scope == 'isolated' && 'namespace-profile-mac-ci-tests-84gb' || 'namespace-profile-mac-ci' }}
          cache_scope: ${{ inputs.cache_scope || 'shared' }}
          counted: ${{ inputs.warmup && 'false' || 'true' }}
          cache_provider: ${{ steps.prepare_environment.outputs.rust_cache_provider }}
          cache_identity: ${{ steps.prepare_environment.outputs.rust_cache_identity }}
          cache_hit: ${{ steps.prepare_environment.outputs.rust_cache_hit }}
          artifact_name: macos-compile-cache-${{ inputs.cache_scope || 'shared' }}-${{ matrix.cache_mode }}-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
