on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

name: macOS Compile Cache Experiment
concurrency:
  group: macos-compile-cache-experiment-treatment-volumes
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  WORKSPACE_TEST_ARGS: --workspace --locked --exclude command-signatures-v2
  RUSTFLAGS: -C debuginfo=line-tables-only --cfg=web_sys_unstable_apis

jobs:
  guard:
    name: Validate experiment source
    if: >-
      github.repository_owner == 'warpdotdev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'kevinyang/macos-ci-observability'
    timeout-minutes: 3
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record immutable experiment input
        env:
          MERGE_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "Merge SHA: $MERGE_SHA"
            echo "Source SHA: $SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  seed:
    name: Seed tests cache (${{ matrix.cache_scope }})
    needs: guard
    timeout-minutes: 40
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - cache_scope: 50gb
            runner: namespace-profile-mac-ci-tests-50gb
          - cache_scope: 84gb
            runner: namespace-profile-mac-ci-tests-84gb
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/prepare_environment
        id: prepare_environment
        with:
          target_os: macos
          is_self_hosted: false
          install_test_deps: true

      - name: Install cargo nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: nextest

      - name: Seed cache
        uses: ./.github/actions/compile_macos_tests
        with:
          workspace_test_args: ${{ env.WORKSPACE_TEST_ARGS }}
          source_sha: ${{ github.event.pull_request.head.sha }}
          runner_profile: ${{ matrix.runner }}
          cache_scope: ${{ matrix.cache_scope }}
          counted: 'false'
          cache_provider: ${{ steps.prepare_environment.outputs.rust_cache_provider }}
          cache_identity: ${{ steps.prepare_environment.outputs.rust_cache_identity }}
          cache_hit: ${{ steps.prepare_environment.outputs.rust_cache_hit }}
          artifact_name: macos-compile-cache-${{ matrix.cache_scope }}-seed-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  block_identity:
    name: Validate matched treatment block
    needs: seed
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download 50 GB seed diagnostics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-compile-cache-50gb-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seed-50gb

      - name: Download 84 GB seed diagnostics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-compile-cache-84gb-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seed-84gb

      - name: Compare treatment inputs
        shell: bash
        run: |
          set -euo pipefail
          for key in checked_out_tree_sha environment_identity_sha; do
            value_50gb="$(sed -n "s/^$key=//p" "$RUNNER_TEMP/seed-50gb/metrics.env")"
            value_84gb="$(sed -n "s/^$key=//p" "$RUNNER_TEMP/seed-84gb/metrics.env")"
            if [ -z "$value_50gb" ] || [ "$value_50gb" != "$value_84gb" ]; then
              echo "::error::Treatment seeds do not share $key"
              exit 1
            fi
          done

  measure:
    name: Measure tests cache (${{ matrix.cache_scope }})
    needs: block_identity
    timeout-minutes: 40
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - cache_scope: 50gb
            runner: namespace-profile-mac-ci-tests-50gb
          - cache_scope: 84gb
            runner: namespace-profile-mac-ci-tests-84gb
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}

      - name: Download seed diagnostics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-compile-cache-${{ matrix.cache_scope }}-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seed-diagnostics

      - name: Read seed identity
        id: seed_identity
        shell: bash
        run: |
          set -euo pipefail
          metrics="$RUNNER_TEMP/seed-diagnostics/metrics.env"
          for key in checked_out_tree_sha environment_identity_sha post_target_manifest_sha post_target_kib; do
            value="$(sed -n "s/^$key=//p" "$metrics")"
            if [ -z "$value" ]; then
              echo "::error::Seed diagnostics are missing $key"
              exit 1
            fi
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
          done

      - uses: ./.github/actions/prepare_environment
        id: prepare_environment
        with:
          target_os: macos
          is_self_hosted: false
          install_test_deps: true

      - name: Install cargo nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: nextest

      - name: Measure restored cache
        uses: ./.github/actions/compile_macos_tests
        with:
          workspace_test_args: ${{ env.WORKSPACE_TEST_ARGS }}
          source_sha: ${{ github.event.pull_request.head.sha }}
          runner_profile: ${{ matrix.runner }}
          cache_scope: ${{ matrix.cache_scope }}
          counted: 'true'
          expected_tree_sha: ${{ steps.seed_identity.outputs.checked_out_tree_sha }}
          expected_environment_sha: ${{ steps.seed_identity.outputs.environment_identity_sha }}
          expected_target_manifest_sha: ${{ steps.seed_identity.outputs.post_target_manifest_sha }}
          expected_target_kib: ${{ steps.seed_identity.outputs.post_target_kib }}
          cache_provider: ${{ steps.prepare_environment.outputs.rust_cache_provider }}
          cache_identity: ${{ steps.prepare_environment.outputs.rust_cache_identity }}
          cache_hit: ${{ steps.prepare_environment.outputs.rust_cache_hit }}
          artifact_name: macos-compile-cache-${{ matrix.cache_scope }}-measure-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scratch:
    name: Measure scratch control
    needs: block_identity
    timeout-minutes: 40
    runs-on: namespace-profile-mac-ci-tests-scratch
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}

      - name: Download matched seed diagnostics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-compile-cache-50gb-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seed-diagnostics

      - name: Read matched build identity
        id: seed_identity
        shell: bash
        run: |
          set -euo pipefail
          metrics="$RUNNER_TEMP/seed-diagnostics/metrics.env"
          for key in checked_out_tree_sha environment_identity_sha; do
            value="$(sed -n "s/^$key=//p" "$metrics")"
            if [ -z "$value" ]; then
              echo "::error::Seed diagnostics are missing $key"
              exit 1
            fi
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_OUTPUT"
          done

      - name: Use ephemeral Rust paths
        run: |
          {
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-home"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/prepare_environment
        id: prepare_environment
        with:
          target_os: macos
          is_self_hosted: false
          install_test_deps: true
          enable_rust_cache: false
          enable_namespace_cache: false

      - name: Install cargo nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: nextest

      - name: Measure scratch compile
        uses: ./.github/actions/compile_macos_tests
        with:
          workspace_test_args: ${{ env.WORKSPACE_TEST_ARGS }}
          source_sha: ${{ github.event.pull_request.head.sha }}
          runner_profile: namespace-profile-mac-ci-tests-scratch
          cache_scope: scratch
          counted: 'true'
          expected_tree_sha: ${{ steps.seed_identity.outputs.checked_out_tree_sha }}
          expected_environment_sha: ${{ steps.seed_identity.outputs.environment_identity_sha }}
          cache_provider: ${{ steps.prepare_environment.outputs.rust_cache_provider }}
          cache_identity: ${{ steps.prepare_environment.outputs.rust_cache_identity }}
          cache_hit: ${{ steps.prepare_environment.outputs.rust_cache_hit }}
          artifact_name: macos-compile-cache-scratch-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
