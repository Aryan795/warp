[package]
name = "warp_logging"
edition = "2024"
description = "Warp logging configuration"
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
cfg-if.workspace = true
env_logger.workspace = true
log.workspace = true
warp_core.workspace = true
warp_errors.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
dirs.workspace = true
log-panics = { version = "2.1.0", features = ["with-backtrace"] }
# Log bundles only ever write Deflate entries (see native.rs), so disable zip's other codecs
# (bzip2/lzma/xz/zstd/aes-crypto/deflate64) and its zopfli DEFLATE backend, which compresses
# in unbounded-size blocks and is otherwise unused since we never request quality > 9.
zip = { version = "2.1", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

# Optional crash reporting integration.
sentry = { workspace = true, optional = true }
sentry-log = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = { version = "0.1.6" }
js-sys = "0.3.63"
wasm-bindgen.workspace = true
web-sys.workspace = true
warp_web_event_bus.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tempfile.workspace = true

[features]
crash_reporting = ["dep:sentry", "dep:sentry-log", "warp_errors/crash_reporting"]
agent_mode_evals = []
